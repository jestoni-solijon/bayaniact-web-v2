                                    <td data-type="blotter-firstName" th:text="${blotter.user != null ? blotter.user.firstName : blotter.firstName}"></td>
                                    <td data-type="blotter-middleName" th:text="${blotter.user != null ? blotter.user.middleName : blotter.middleName}"></td>

                                    <td data-type="blotter-phone" th:text="${blotter.user != null ? blotter.user.phoneNumber : blotter.phone}"></td>
                                    <td data-type="blotter-accusedLastName" th:text="${blotter.accusedLastName}"></td>

                                           aria-label="Previous">
                                            <span aria-hidden="true">&laquo;</span>
                                        </a>
                                    </li>

                                    <!-- Page Numbers -->
                                    <th:block th:each="i : ${#numbers.sequence(0, blotters.totalPages - 1)}">
                                        <li class="page-item" th:classappend="${blotters.number == i} ? 'active' : ''">
                                            <a class="page-link" th:classappend="${blotters.number == i} ? 'bg-secondary text-white' : ''"
                                               th:href="${blotters.number == i} ? '#' : @{/dashboard/blotter/list(page=${i}, size=${blotters.size})}"
                                               th:text="${i + 1}" th:attr="aria-disabled=${blotters.number == i}"></a>
                                        </li>
                                    </th:block>

                                    <!-- Next Button -->
                                    <li class="page-item" th:classappend="${blotters.hasNext()} ? '' : 'disabled'">
                                        <a class="page-link" th:href="${blotters.hasNext()} ? @{/dashboard/blotter/list(page=${blotters.number + 1}, size=${blotters.size})} : '#'"

<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
     aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog modal-lg">
        <form action="#" th:action="@{/dashboard/blotter/update}" method="POST">
            <input type="hidden" id="modal-blotter-id" name="blotterId">
            <div class="modal-content ">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Blotter</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h5>Complainant Statement</h5>
                    <div class="row">
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label">What</label>
                            <input type="text" class="form-control form-control-sm " id="modal-blotter-what" readonly>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label">Where</label>
                            <input type="text" class="form-control form-control-sm " id="modal-blotter-where" readonly>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label">When</label>
                            <input type="text" class="form-control form-control-sm " id="modal-blotter-when" readonly>
                        </div>
                    </div>
                    <h5>Complainant Details</h5>
                    <div class="row">
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label">Lastname</label>
                            <input type="text" class="form-control form-control-sm " id="modal-blotter-lastname" readonly>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label">Firstname</label>
                            <input type="text" class="form-control form-control-sm " id="modal-blotter-firstname" readonly>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label">Middle name</label>
                            <input type="text" class="form-control form-control-sm " id="modal-blotter-middleName" readonly>
                        </div>
                    </div>

                    <h5>Accused Details</h5>
                    <div class="row">
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label">Lastname</label>
                            <input type="text" class="form-control form-control-sm " id="modal-blotter-accusedLastname" readonly>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label">Firstname</label>
                            <input type="text" class="form-control form-control-sm " id="modal-blotter-accusedFirstname" readonly>
                        </div>
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label">Middle name</label>
                            <input type="text" class="form-control form-control-sm " id="modal-blotter-accusedMiddleName" readonly>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-12 col-md-12 mb-3">
                            <label class="form-label">Schedule</label>
                            <input type="datetime-local" class="form-control form-control-sm " name="schedule" id="modal-blotter-schedule" >
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-outline-success " data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-sm btn-success ">Submit</button>
                </div>
            </div>
        </form>
    </div>
</div>



<script>
    document.addEventListener('DOMContentLoaded', function () {
             const buttons = document.querySelectorAll('.btn-transparent');

             buttons.forEach(button => {
                 button.addEventListener('click', function () {
                     const row = this.closest('tr');

                     // Define a mapping of data-type attributes to modal field IDs
                     const fieldMappings = {
                         'blotter-id': 'modal-blotter-id',
                         'blotter-what': 'modal-blotter-what',
                         'blotter-where': 'modal-blotter-where',
                         'blotter-when': 'modal-blotter-when',
                         'blotter-firstName': 'modal-blotter-firstname',
                         'blotter-lastName': 'modal-blotter-lastname',
                         'blotter-middleName': 'modal-blotter-middleName',
                         'blotter-accusedFirstName': 'modal-blotter-accusedFirstname',
                         'blotter-accusedLastName': 'modal-blotter-accusedLastname',
                         'blotter-accusedMiddleName': 'modal-blotter-accusedMiddleName'
                     };

                     // Loop through the mappings and populate modal fields
                     for (const [dataType, modalField] of Object.entries(fieldMappings)) {
                         const cell = row.querySelector(`[data-type="${dataType}"]`);

                         if (cell) {
                             const modalInput = document.getElementById(modalField);
                             if (modalInput) {
                                 modalInput.value = cell.textContent.trim(); // Set the field value
                             }


                         }
                     }

                     // Set the hidden event ID in the modal
                     const eventId = row.querySelector('[data-type="event-id"]').textContent.trim();
                     document.getElementById('modal-event-id').value = eventId;
                 });
             });
         });
</script>
